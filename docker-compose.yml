services:
  mariadb:
    image: mariadb:10.11
    container_name: cremadnata_mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: cremadnata
    ports:
      - "3306:3306"
    volumes:
      - ./data/mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    container_name: cremadnata_mongodb
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - ./data/mongodb:/data/db
    environment:
      MONGO_INITDB_DATABASE: orders_db

  app-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: cremadnata_app_dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_NAME=cremadnata
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_DB=orders_db
      - MONGO_ATLAS_URI=${MONGO_ATLAS_URI}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=7d
    volumes:
      - ./src:/app/src
    depends_on:
      mariadb:
        condition: service_healthy
      mongodb:
        condition: service_started

  app-prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cremadnata_app_prod
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_NAME=cremadnata
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_DB=orders_db
      - MONGO_ATLAS_URI=${MONGO_ATLAS_URI}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=7d
    depends_on:
      mariadb:
        condition: service_healthy
      mongodb:
        condition: service_started